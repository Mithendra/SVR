<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SVR IOCL Station</title>
    <link rel="stylesheet" href="styles/app.css" />
  </head>
  <body>
    <div class="shell">
      <section id="login-view" class="login-view">
        <div class="brand-lockup">
          <div class="brand-lockup-row">
            <img src="assets/iocl-logo.png" alt="IndianOil" class="brand-mark" />
            <div class="brand-lockup-divider"></div>
            <span class="brand-wordmark">SVR</span>
          </div>
          <div class="brand-caption">Indian Oil Service Station</div>
        </div>

        <div class="login-card">
          <form id="login-form">
            <label for="login-name">Login</label>
            <input id="login-name" name="login-name" autocomplete="username" required />
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required />
            <button type="submit">Sign in</button>
            <p id="login-error" class="error" role="alert"></p>
          </form>
          <p style="margin-top: 10px">
            <a href="#" id="forgot-link" style="font-size: 12px; color: var(--io-blue)">Forgot password?</a>
          </p>
          <p id="forgot-status" class="error" role="status"></p>
        </div>
      </section>

      <section id="nav-view" class="app-shell" hidden>
        <aside class="sidebar">
          <div class="sidebar-brand">
            <img src="assets/iocl-logo.png" alt="IndianOil" class="brand-mark" />
            <div class="sidebar-brand-text">
              <span class="brand-wordmark">SVR</span>
              <span class="brand-caption">Indian Oil Station</span>
            </div>
          </div>
          <nav id="nav-links" aria-label="Modules"></nav>
        </aside>

        <div class="app-shell-main">
          <header class="topbar">
            <span id="who" class="topbar-who"></span>
            <button id="logout" class="topbar-signout" type="button">Sign out</button>
          </header>
          <div class="app-shell-placeholder">
            <p>Choose a module from the left to get started.</p>
          </div>
        </div>
      </section>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>
